<!doctype html>
<html lang="kk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Сан — калькулятор</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="page">
		<header>
			<div class="brand"><span class="brand-mark">+</span> сан</div>
			<span class="eyebrow">дәл. жылдам. түсінікті.</span>
		</header>

		<main>
			<section class="intro">
				  <div class="eyebrow">онлайн-калькулятор / 01</div>
				  <h1>Оңай<br>есепте.</h1>
				  <p>Күнделікті есептеулерге арналған қарапайым құрал. Артық ештеңе жоқ — тек сандар мен нәтиже.</p>
				  <div class="tip"><span class="key">Enter</span> нәтижені көрсету <span class="key">Esc</span> тазарту</div>
			</section>

			<section class="calculator" aria-label="Калькулятор">
				<div class="display" aria-live="polite">
					<div class="previous" id="previous"></div>
					<div class="current" id="current">0</div>
				</div>
				<div class="keys">
					  <button class="utility" data-action="clear">ТАЗА</button>
					  <button class="utility" data-action="delete">ӨШІР</button>
					<button class="utility" data-action="percent">%</button>
					<button class="operator" data-operator="/">÷</button>
					<button data-number="7">7</button>
					<button data-number="8">8</button>
					<button data-number="9">9</button>
					<button class="operator" data-operator="*">×</button>
					<button data-number="4">4</button>
					<button data-number="5">5</button>
					<button data-number="6">6</button>
					<button class="operator" data-operator="-">−</button>
					<button data-number="1">1</button>
					<button data-number="2">2</button>
					<button data-number="3">3</button>
					<button class="operator" data-operator="+">+</button>
					<button class="zero" data-number="0">0</button>
					<button data-number=".">.</button>
					<button class="equals" data-action="equals">=</button>
				</div>
			</section>
		</main>
	</div>

	<script src="src.js"></script>
</body>
</html>
